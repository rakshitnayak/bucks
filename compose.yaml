services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: daybook
      POSTGRES_USER: daybook
      POSTGRES_PASSWORD: daybook-local-only
    ports:
      - "55432:5432"
    volumes:
      - daybook_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daybook -d daybook"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  daybook_postgres:
